presets:
  custom:
    name: "AI健康财经简报"
    description: "每日早晚八点准时推送"
    default:
      collect: true
      analyze: false
      push: false
      report_mode: "current"
      once:
        push: true
    periods:
      morning_push:
        name: "早间简报"
        start: "08:00"
        end: "08:59"
        analyze: true
        push: true
      evening_push:
        name: "晚间简报"
        start: "20:00"
        end: "20:59"
        analyze: true
        push: true
    day_plans:
      daily:
        periods: ["morning_push", "evening_push"]
    week_map:
      1: "daily"
      2: "daily"
      3: "daily"
      4: "daily"
      5: "daily"
      6: "daily"
      7: "daily"
