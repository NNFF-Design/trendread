presets:
  custom:
    name: "健康财经推送计划"
    description: "针对40-50岁人群，每日早晚八点AI简报"
    default:
      collect: true
      analyze: false
      push: false
      report_mode: "current"
      once:
        push: true
    periods:
      morning_8am:
        name: "早上推送"
        start: "08:00"
        end: "08:59"
        analyze: true  # 开启AI分析
        push: true     # 开启推送
      evening_8pm:
        name: "晚上推送"
        start: "20:00"
        end: "20:59"
        analyze: true  # 开启AI分析
        push: true     # 开启推送
    day_plans:
      daily:
        periods: ["morning_8am", "evening_8pm"]
    week_map:
      1: "daily"
      2: "daily"
      3: "daily"
      4: "daily"
      5: "daily"
      6: "daily"
      7: "daily"
