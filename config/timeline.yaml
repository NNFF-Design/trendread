presets:
  custom:
    name: "AI 定时简报"
    description: "早晚 8 点健康财经推送"
    default:
      collect: true
      analyze: false
      push: false
      report_mode: "current"
      once:
        push: true
    periods:
      morning_8am:
        name: "早间简报"
        start: "08:00"
        end: "08:59"
        analyze: true # 开启分析
        push: true
      evening_8pm:
        name: "晚间简报"
        start: "20:00"
        end: "20:59"
        analyze: true # 开启分析
        push: true
    day_plans:
      daily:
        periods: ["morning_8am", "evening_8pm"]
    week_map:
      1: "daily"
      2: "daily"
      3: "daily"
      4: "daily"
      5: "daily"
      6: "daily"
      7: "daily"
