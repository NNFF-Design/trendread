presets:
  custom:
    name: "全天测试推送"
    description: "当前用于立即验证推送功能"
    # 必须包含 default 字段
    default:
      collect: true
      analyze: true
      push: true
      report_mode: "full"
    periods:
      all_day:
        name: "全天候"
        start: "00:00"
        end: "23:59"
        push: true
    day_plans:
      daily:
        periods: ["all_day"]
    week_map:
      1: "daily"
      2: "daily"
      3: "daily"
      4: "daily"
      5: "daily"
      6: "daily"
      7: "daily"
