app:
  timezone: "Asia/Shanghai"

schedule:
  enabled: true
  preset: "custom" # 必须用这个词，不能用 always_on

ai:
  enabled: true
  provider: "openai"
  base_url: "https://api.moonshot.cn/v1"
  api_key: "sk-5fEyovRIVFngg3CNyvR0cF5ptCSx70ZyFsWgMdtIS7slfjBy"
  model: "moonshot-v1-8k"

platforms:
  enabled: true
  sources:
    - id: "weibo"
    - id: "toutiao"
    - id: "thepaper"
    - id: "wallstreetcn-hot"
    - id: "cls-hot"

report:
  mode: "full"
  display_mode: "keyword"

display:
  regions:
    hotlist: true
    rss: true
    ai_analysis: true

# 注意：下面的缩进必须非常精确，每层是 2 个空格
notification:
  enabled: true
  default: "wechat_work"
  wechat_work:
    webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=628381f1-4d65-4b91-8f32-14a3f6dabfbe"
