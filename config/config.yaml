app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: true
  preset: "always_on" # 【已修改】测试时使用 always_on，确保立即触发推送

# Moonshot AI (Kimi) 配置
ai:
  enabled: true
  provider: "openai"
  base_url: "https://api.moonshot.cn/v1"
  api_key: "sk-5fEyovRIVFngg3CNyvR0cF5ptCSx70ZyFsWgMdtIS7slfjBy"
  model: "moonshot-v1-8k"

platforms:
  enabled: true
  sources:
    - id: "weibo"
    - id: "toutiao"
    - id: "zhihu"
    - id: "thepaper"
    - id: "wallstreetcn-hot"
    - id: "cls-hot"
    - id: "ifeng"
    - id: "douyin"
    - id: "36kr"

report:
  mode: "current"
  display_mode: "keyword" # 隐藏链接，通过 AI 总结呈现

display:
  regions:
    hotlist: true
    rss: true
    ai_analysis: true # 开启 AI 总结

notification:
  enabled: true
  default: "wechat_work"
  wechat_work:
    webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=628381f1-4d65-4b91-8f32-14a3f6dabfbe"
