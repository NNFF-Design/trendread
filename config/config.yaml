app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: true
  preset: "custom" 

# Moonshot AI (Kimi) 接入
ai:
  enabled: true
  provider: "openai"
  base_url: "https://api.moonshot.cn/v1"
  api_key: "sk-5fEyovRIVFngg3CNyvR0cF5ptCSx70ZyFsWgMdtIS7slfjBy"
  model: "moonshot-v1-8k"

platforms:
  enabled: true
  # 开启全平台数据源
  sources:
    - id: "weibo"
    - id: "toutiao"
    - id: "zhihu"
    - id: "thepaper"
    - id: "wallstreetcn-hot"
    - id: "cls-hot"
    - id: "ifeng"
    - id: "douyin"
    - id: "36kr"

report:
  mode: "current"
  display_mode: "keyword" # AI总结模式下不显示杂乱链接

display:
  regions:
    hotlist: true
    rss: true
    ai_analysis: true

notification:
  enabled: true
  default: "wechat_work"
  wechat_work:
    webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=628381f1-4d65-4b91-8f32-14a3f6dabfbe"
