# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件 (定制版)
# ═══════════════════════════════════════════════════════════════

app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: true
  preset: "custom"  # 强制使用自定义时间线

# 数据源全部开启
platforms:
  enabled: true
  sources:
    - id: "weibo"
      name: "微博"
    - id: "toutiao"
      name: "今日头条"
    - id: "zhihu"
      name: "知乎"
    - id: "thepaper"
      name: "澎湃新闻"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
    - id: "cls-hot"
      name: "财联社热门"
    - id: "ifeng"
      name: "凤凰网"
    - id: "douyin"
      name: "抖音"
    - id: "36kr"
      name: "36氪"
    - id: "v2ex"
      name: "V2EX"
    - id: "hacker-news"
      name: "Hacker News"

rss:
  enabled: true
  feeds:
    - id: "hacker-news-rss"
      name: "HN Frontpage"
      url: "https://hnrss.org/frontpage"

report:
  mode: "current"
  # 使用 keyword 模式以最大程度减少原始链接的直接干扰
  display_mode: "keyword" 

display:
  region_order:
    - hotlist
    - rss
  regions:
    hotlist: true
    rss: true
    new_items: false
    standalone: false
    # 【指令修改】彻底关闭 AI 总结
    ai_analysis: false 

notification:
  enabled: true
  # 注意：请在这里下方配置您的具体推送渠道（Feishu/Bark等）的 Webhook
