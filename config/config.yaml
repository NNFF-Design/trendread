app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: true
  preset: "always_on" # 强制开启：跳过所有时间判断，运行即推送

# Moonshot AI (Kimi) 正确配置
ai:
  enabled: true
  provider: "openai"
  base_url: "https://api.moonshot.cn/v1"
  api_key: "sk-5fEyovRIVFngg3CNyvR0cF5ptCSx70ZyFsWgMdtIS7slfjBy"
  model: "moonshot-v1-8k"

platforms:
  enabled: true
  sources:
    - id: "weibo"
    - id: "toutiao"
    - id: "thepaper"
    - id: "wallstreetcn-hot"
    - id: "cls-hot"

report:
  mode: "full"         # 强制全量：确保哪怕没新消息，也会把热榜推给你，用于测试
  display_mode: "keyword" 

display:
  regions:
    hotlist: true
    rss: true
    ai_analysis: true

notification:
  enabled: true
  default: "wechat_work"
  wechat_work:
    # 你的企业微信机器人地址
    webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=628381f1-4d65-4b91-8f32-14a3f6dabfbe"
