app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: true
  preset: "custom"

platforms:
  enabled: true
  sources:
    - id: "weibo"
      name: "微博"
    - id: "toutiao"
      name: "今日头条"
    - id: "zhihu"
      name: "知乎"
    - id: "thepaper"
      name: "澎湃新闻"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
    - id: "cls-hot"
      name: "财联社热门"
    - id: "ifeng"
      name: "凤凰网"
    - id: "douyin"
      name: "抖音"

rss:
  enabled: true
  feeds:
    - id: "hacker-news-rss"
      name: "HN"
      url: "https://hnrss.org/frontpage"

report:
  mode: "current"
  display_mode: "keyword" 

display:
  region_order:
    - hotlist
    - rss
  regions:
    hotlist: true
    rss: true
    new_items: false
    standalone: false
    ai_analysis: false 

notification:
  enabled: true
  # 请务必检查下方飞书/钉钉的缩进，必须比 notification 多两个空格
  feishu:
    webhook_url: "这里填你的URL"
