app:
  timezone: "Asia/Shanghai"

schedule:
  enabled: true
  preset: "always_on" # 重点：这里改回 always_on，让 crawler.yml 决定时间

platforms:
  enabled: true
  sources:
    - id: "weibo"
    - id: "toutiao"
    - id: "zhihu"
    - id: "thepaper"
    - id: "wallstreetcn-hot"
    - id: "cls-hot"
    - id: "ifeng"
    - id: "douyin"

report:
  mode: "full"         # 第一次运行建议用 full，确保一定有东西出
  display_mode: "keyword"

display:
  regions:
    hotlist: true
    rss: true
    ai_analysis: false # 按照要求关闭 AI

notification:
  enabled: true
  # 请在此处下方正确缩进填写您的 Webhook
  feishu:
    webhook_url: "这里填写你的URL"
