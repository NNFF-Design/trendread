name: TrendRadar Crawler

on:
  workflow_dispatch:
  schedule:
    # 00:00 和 12:00 UTC 对应北京时间 08:00 和 20:00
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Run TrendRadar
        run: |
          # 针对新版 v2.0+ 的标准运行方式
          # 设置 PYTHONPATH 确保系统能识别 trendradar 模块
          export PYTHONPATH=$PYTHONPATH:.
          python -m trendradar
        env:
          PYTHONPATH: .
