name: TrendRadar Crawler Debug

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Files Structure
        run: |
          echo "--- 正在列出仓库所有文件，寻找 main.py ---"
          find . -maxdepth 3 -not -path '*/.*'
          echo "------------------------------------------"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # 尝试安装依赖，如果找不到 requirements 也不报错
          find . -name "requirements.txt" -exec pip install -r {} + || echo "No requirements found"

      - name: Force Run
        run: |
          # 尝试直接运行
          if [ -f "main.py" ]; then
            python main.py
          elif [ -f "TrendRadar/main.py" ]; then
            cd TrendRadar && python main.py
          else
            # 如果还是找不到，尝试搜索所有 .py 文件并运行包含 "main" 的那个
            POTENTIAL_MAIN=$(find . -name "*.py" | grep "main" | head -n 1)
            if [ ! -z "$POTENTIAL_MAIN" ]; then
              cd $(dirname "$POTENTIAL_MAIN")
              python $(basename "$POTENTIAL_MAIN")
            else
              echo "错误：真的找不到任何类似 main.py 的文件！"
              exit 1
            fi
          fi
