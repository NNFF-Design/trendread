name: TrendRadar Crawler

on:
  workflow_dispatch:
  schedule:
    # 这里的 00 00 和 00 12 对应北京时间 08:00 和 20:00
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler
        run: python main.py
        env:
          PYTHONPATH: .
