# timeline.yaml
presets:
  custom:
    name: "定制推送模式"
    description: "每天 8:00 和 20:00 推送，不含 AI 总结。"
    
    default:
      collect: true                # 始终采集数据以保持数据连续性
      analyze: false               # 全天关闭 AI 分析
      push: false                  # 默认不推送
      report_mode: "current"
      once:
        push: true                 # 每个时段只推一次

    periods:
      morning_push:
        name: "早间推送"
        start: "08:00"
        end: "09:00"
        push: true                 # 开启推送
        
      evening_push:
        name: "晚间推送"
        start: "20:00"
        end: "21:00"
        push: true                 # 开启推送

    day_plans:
      all_day:
        periods: ["morning_push", "evening_push"]

    week_map:
      1: "all_day"
      2: "all_day"
      3: "all_day"
      4: "all_day"
      5: "all_day"
      6: "all_day"
      7: "all_day"
